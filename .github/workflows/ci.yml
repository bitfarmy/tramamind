name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Test del pacchetto e della chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  shell-syntax:
    name: Controllo sintassi script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n su tutti gli script
        run: |
          set -e
          for f in scripts/*.sh benchmarks/*.sh; do
            echo "syntax check: $f"
            bash -n "$f"
          done

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh benchmarks/*.sh