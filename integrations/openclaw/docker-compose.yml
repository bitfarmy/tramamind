# TramaMind × OpenClaw — gateway L5b in Docker (hardened)
# Requisiti: Docker + OmniRoute in ascolto su localhost:8080 (sull'host)
services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.3.7   # versione pinnata, non :latest
    container_name: tramamind-openclaw
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"                  # solo localhost, mai esposto in LAN
    extra_hosts:
      - "host.docker.internal:host-gateway"      # necessario su Linux per raggiungere OmniRoute sull'host
    volumes:
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
      - ./openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - ./SOUL.md:/home/node/.openclaw/workspace/SOUL.md:ro
    env_file:
      - .env                                     # TELEGRAM_BOT_TOKEN, OPENCLAW_GATEWAY_TOKEN (gitignored)
    environment:
      - NODE_ENV=production
    mem_limit: 2g                                # sotto i 2 GB il gateway va in OOM all'avvio
    mem_reservation: 1g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s                         # primo avvio: compilazione WASM, 3-7 min
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openclaw-config:
  openclaw-workspace:
