[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tramamind"
version = "0.2.0"
description = "IA personale multi-modello: router, distillati locali, API gratuite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "keyring>=24.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tramamind = "cli.main:main"

[tool.setuptools]
packages = ["router", "cli"]
