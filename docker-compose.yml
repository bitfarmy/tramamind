# Percorso opzionale per avere Ollama e OmniRoute in Docker.
# La chat con il tetto è `tramamind chat`, che parla con Ollama su :11434.
# OpenHands non parte con `docker compose up`: è nel profilo "agent".
#
#   docker compose up -d
#   tramamind chat

name: tramamind

services:

  # ---------- L1: runtime modelli locali ----------
  ollama:
    image: ollama/ollama:latest
    container_name: tramamind-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU NVIDIA (se disponibile):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- L4: router / gateway ----------
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: tramamind-omniroute
    restart: unless-stopped
    stop_timeout: 40
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      # 1024 MB bastano per la chat. Alza il valore solo se ci fai girare agenti.
      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB:-1024}
    mem_limit: ${OMNIROUTE_CONTAINER_MEM:-2g}
    volumes:
      - omniroute-data:/app/data
    depends_on:
      ollama:
        condition: service_healthy

  # Extra. docker compose --profile agent up
  openhands:
    profiles: ["agent"]
    image: docker.openhands.dev/openhands/openhands:1.8
    container_name: tramamind-openhands
    restart: unless-stopped
    pull_policy: always
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AGENT_SERVER_IMAGE_REPOSITORY: ghcr.io/openhands/agent-server
      AGENT_SERVER_IMAGE_TAG: 1.26.0-python
      # LLM di OpenHands -> OmniRoute. Il prefisso openai/ seleziona il
      # trasporto OpenAI-compatible in LiteLLM; "auto" = smart routing.
      LLM_MODEL: ${OPENHANDS_MODEL:-openai/auto}
      LLM_BASE_URL: http://omniroute:20128/v1
      LLM_API_KEY: ${OMNIROUTE_API_KEY:-omniroute}
      # Failover gestito da OmniRoute: retry interni ridotti al minimo
      LLM_NUM_RETRIES: "2"
      LLM_TIMEOUT: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openhands-state:/.openhands
      - ${WORKSPACE_BASE:-./workspace}:/opt/workspace_base
    depends_on:
      - omniroute

volumes:
  ollama-data:
  omniroute-data:
  openhands-state:
